<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"><header>
        <h1><i class="fa-solid fa-clapperboard"></i> Movie Finder</h1>
        <p>Search for your favourite movies</p>
    </header>
    <div class="search-container">
        <form  class="search-form" id="movieForm">
            <input type="text" id="movieInput" placeholder="Enter movie name(e.g., Inception,Avatar)" required />
            <button type="submit">Search Movies</button>
        </form>
    </div>
    <div id="movieResults"></div>
</div>
<script src="script.js"></script>
</body>
</html>
